name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test

  lint:
    name: StyLua
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin tests scripts

  typecheck:
    name: LuaLS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install LuaLS 3.19.1
        run: |
          mkdir -p "$RUNNER_TEMP/lua-language-server"
          curl --fail --location --silent --show-error https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz -o "$RUNNER_TEMP/lua-language-server.tar.gz"
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/lua-language-server.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lua-language-server.tar.gz" -C "$RUNNER_TEMP/lua-language-server"
          echo "$RUNNER_TEMP/lua-language-server/bin" >> "$GITHUB_PATH"
      - run: make typecheck
